name: Test ambient Agent Card signing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign with GitHub OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install rh-sigstore-a2a
        run: python -m pip install rh-sigstore-a2a

      - name: Record installed version
        run: rh-sigstore-a2a --version

      - name: Sign Agent Card with ambient credentials
        run: |
          rh-sigstore-a2a sign agent-card.json \
            --output agent-card.signed.json \
            --use_ambient_credentials

      - name: Validate signed JSON
        run: python -m json.tool agent-card.signed.json > /dev/null

      - name: Upload signed Agent Card
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-agent-card
          path: agent-card.signed.json
          if-no-files-found: error
          retention-days: 7
